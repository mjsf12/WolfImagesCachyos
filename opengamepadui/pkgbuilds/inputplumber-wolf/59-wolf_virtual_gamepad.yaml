# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1
kind: CompositeDevice
name: Wolf Virtual Gamepad

matches: []
maximum_sources: 1

# OpenGamepadUI does not enable InputPlumber's global manage-all mode. Manage
# only Wolf's virtual controller automatically when it appears after startup.
options:
  auto_manage: true

# Wolf creates the Moonlight gamepad after the application container starts.
# InputPlumber must read it for its D-Bus target, while the original node must
# remain available to games because stable Wolf does not relay virtual devices
# created later through the application's own /dev/uinput.
source_devices:
  - group: gamepad
    unique: true
    passthrough: true
    udev:
      attributes:
        - name: name
          value: "Wolf *"
      properties:
        - name: ID_INPUT_JOYSTICK
          value: "1"
      sys_name: "event*"
      subsystem: input

# Create the desktop targets before Gamescope enumerates /dev/input. Profiles
# decide whether events are routed to these targets; keeping them alive avoids
# hotplugging devices that the isolated Wolf container cannot materialize via
# udev after the session is already running.
target_devices:
  - mouse
  - keyboard
