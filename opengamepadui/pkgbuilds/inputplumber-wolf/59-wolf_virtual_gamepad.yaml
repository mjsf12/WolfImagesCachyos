# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1
kind: CompositeDevice
name: Wolf Virtual Gamepad

matches: []
maximum_sources: 1

# OpenGamepadUI does not enable InputPlumber's global manage-all mode. Manage
# only Wolf's virtual controller automatically when it appears after startup.
options:
  auto_manage: true

# Wolf creates the Moonlight gamepad after the application container starts.
# InputPlumber owns it exclusively; games must only consume the virtual targets
# below so profiles and interception remain authoritative end to end.
source_devices:
  - group: gamepad
    unique: true
    udev:
      attributes:
        - name: name
          value: "Wolf *"
      properties:
        - name: ID_INPUT_JOYSTICK
          value: "1"
      sys_name: "event*"
      subsystem: input

# Create every output before Gamescope enumerates /dev/input. Normal profiles
# emit through xbox-series. Desktop profiles emit mouse/keyboard while
# GamepadOnly interception prevents unmapped controls from leaking to the Xbox
# target. Keeping all targets alive makes profile changes atomic and avoids
# late udev hotplug in Wolf's private /dev/input.
target_devices:
  - xbox-series
  - mouse
  - keyboard
